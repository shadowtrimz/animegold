<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AnimeGold Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="earn-container">
    <div class="nav-bar">
      <a href="earn.html">Dashboard</a>
      <button id="logoutBtn">Logout</button>
    </div>

    <h1 class="title">AnimeGold Dashboard</h1>

    <!-- Points Display -->
    <div id="pointsDisplay" class="points-box">
      Points: <span id="points">0</span>
    </div>

    <!-- Convert Points -->
    <div class="convert-section">
      <h2>Convert Points</h2>
      <button id="convertBtn">Convert to Reward</button>
    </div>

    <!-- Earn Section -->
    <div class="earn-section">
      <h2>Watch Videos to Earn</h2>
      <p>Watch for 5 seconds to unlock points:</p>
      <iframe 
        src="https://trimz.tv/99-reinforced-wooden-stick" 
        style="width: 100%; max-width: 640px; height: 360px;" 
        frameborder="0" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
      </iframe>
      <button id="claimSeriesBtn" disabled>Claim Points</button>
    </div>
  </div>

  <script type="module" src="earn.js"></script>
</body>
</html>
